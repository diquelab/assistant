<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 프로세스 - 김비서</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f7fa 100%);
            color: #333;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #e0e0e0;
        }

        header {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.dark-mode header {
            background: rgba(15, 15, 35, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            display: inline-block;
            color: #7bc43f;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover { color: #6ab030; transform: translateX(-5px); }

        .theme-toggle {
            width: 60px;
            height: 30px;
            background: rgba(123, 196, 63, 0.2);
            border: 1px solid rgba(123, 196, 63, 0.3);
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        body.dark-mode .theme-toggle {
            background: rgba(123, 196, 63, 0.15);
            border-color: rgba(123, 196, 63, 0.2);
        }

        .theme-toggle:hover { background: rgba(123, 196, 63, 0.3); }

        .toggle-circle {
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        body.dark-mode .toggle-circle {
            background: #1a1a3e;
            transform: translateX(30px);
            color: #ffd700;
        }

        /* 탭 네비게이션 */
        .tab-nav {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-top: 10px;
            padding-top: 4px;
        }
        body.dark-mode .tab-nav { border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tab-nav-inner::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #777;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            white-space: nowrap;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { color: #7bc43f; background: rgba(123, 196, 63, 0.07); }
        .tab-btn.active { color: #7bc43f; border-bottom-color: #7bc43f; background: rgba(123, 196, 63, 0.1); }
        body.dark-mode .tab-btn { color: #888; }
        body.dark-mode .tab-btn:hover { color: #9dda6f; background: rgba(123, 196, 63, 0.12); }
        body.dark-mode .tab-btn.active { color: #9dda6f; border-bottom-color: rgba(123, 196, 63, 0.7); background: rgba(123, 196, 63, 0.12); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        body.dark-mode .page-title h1 { color: #ffffff; }

        .page-title p { color: #999; font-size: 1.1em; }

        .diagram-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        body.dark-mode .diagram-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .diagram-card h2 {
            font-size: 1.6em;
            color: #2c3e50;
            border-bottom: 2px solid #7bc43f;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        body.dark-mode .diagram-card h2 {
            color: #ffffff;
            border-bottom-color: rgba(123, 196, 63, 0.6);
        }

        .svg-wrapper {
            width: 100%;
            overflow-x: auto;
            padding: 20px 0;
        }

        .svg-wrapper svg {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }

        /* 단계 설명 */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .step-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .step-card:hover { transform: translateY(-4px); }

        .step-card .step-num {
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            opacity: 0.7;
        }

        .step-card .step-name {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .step-card .step-desc {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .step-1 { background: rgba(168, 216, 255, 0.3); border: 2px solid #7ABCE8; color: #2c7bb0; }
        .step-2 { background: rgba(168, 230, 168, 0.3); border: 2px solid #7DD87D; color: #2d862d; }
        .step-3 { background: rgba(255, 232, 168, 0.3); border: 2px solid #FFD878; color: #a07800; }
        .step-4 { background: rgba(255, 216, 168, 0.3); border: 2px solid #FFC878; color: #a06000; }
        .step-5 { background: rgba(255, 179, 217, 0.3); border: 2px solid #FF99CC; color: #a0005a; }

        body.dark-mode .step-1 { background: rgba(168, 216, 255, 0.1); color: #9ad0f5; }
        body.dark-mode .step-2 { background: rgba(168, 230, 168, 0.1); color: #9adaaa; }
        body.dark-mode .step-3 { background: rgba(255, 232, 168, 0.1); color: #f5da9a; }
        body.dark-mode .step-4 { background: rgba(255, 216, 168, 0.1); color: #f5c49a; }
        body.dark-mode .step-5 { background: rgba(255, 179, 217, 0.1); color: #f5a0d0; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="dashboard.html" class="back-link">← 대시보드</a>
            <button class="theme-toggle" id="themeToggle" aria-label="테마 전환">
                <div class="toggle-circle">☀️</div>
            </button>
        </div>
        <nav class="tab-nav">
            <div class="tab-nav-inner">
                <a href="dashboard.html" class="tab-btn">🏠 대시보드</a>
                <a href="meeting-result.html" class="tab-btn">📋 회의록</a>
                <a href="chart.html" class="tab-btn">📈 매출 현황</a>
                <a href="diagram.html" class="tab-btn active">🔄 업무 프로세스</a>
                <a href="report.html" class="tab-btn">🔍 사이트 분석</a>
                <a href="design-guide.html" class="tab-btn">🎨 디자인 가이드</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="page-title">
            <h1>🔄 업무 프로세스</h1>
            <p>콘텐츠 제작 5단계 워크플로우</p>
        </div>

        <div class="diagram-card">
            <h2>📊 프로세스 다이어그램</h2>
            <div class="svg-wrapper">
                <svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" width="800" height="200">
                  <defs>
                    <style>
                      .step-box { filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1)); transition: all 0.3s ease; }
                      .step-box:hover { filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.15)); }
                      .step-text { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 16px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
                      .arrow { fill: none; stroke: #999; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
                      .arrow-head { fill: #999; }
                    </style>
                  </defs>
                  <rect width="800" height="200" fill="transparent"/>
                  <g class="step-box">
                    <rect x="20" y="60" width="120" height="80" rx="15" ry="15" fill="#A8D8FF" stroke="#7ABCE8" stroke-width="2"/>
                    <text x="80" y="100" class="step-text">기획</text>
                    <text x="80" y="120" style="font-size: 12px; text-anchor: middle; fill: #666;">계획 수립</text>
                  </g>
                  <g><line x1="145" y1="100" x2="165" y2="100" class="arrow"/><polygon points="175,100 165,95 165,105" class="arrow-head"/></g>
                  <g class="step-box">
                    <rect x="180" y="60" width="120" height="80" rx="15" ry="15" fill="#A8E6A8" stroke="#7DD87D" stroke-width="2"/>
                    <text x="240" y="100" class="step-text">제작</text>
                    <text x="240" y="120" style="font-size: 12px; text-anchor: middle; fill: #666;">콘텐츠 개발</text>
                  </g>
                  <g><line x1="305" y1="100" x2="325" y2="100" class="arrow"/><polygon points="335,100 325,95 325,105" class="arrow-head"/></g>
                  <g class="step-box">
                    <rect x="340" y="60" width="120" height="80" rx="15" ry="15" fill="#FFE8A8" stroke="#FFD878" stroke-width="2"/>
                    <text x="400" y="100" class="step-text">검토</text>
                    <text x="400" y="120" style="font-size: 12px; text-anchor: middle; fill: #666;">품질 확인</text>
                  </g>
                  <g><line x1="465" y1="100" x2="485" y2="100" class="arrow"/><polygon points="495,100 485,95 485,105" class="arrow-head"/></g>
                  <g class="step-box">
                    <rect x="500" y="60" width="120" height="80" rx="15" ry="15" fill="#FFD8A8" stroke="#FFC878" stroke-width="2"/>
                    <text x="560" y="100" class="step-text">배포</text>
                    <text x="560" y="120" style="font-size: 12px; text-anchor: middle; fill: #666;">서비스 제공</text>
                  </g>
                  <g><line x1="625" y1="100" x2="645" y2="100" class="arrow"/><polygon points="655,100 645,95 645,105" class="arrow-head"/></g>
                  <g class="step-box">
                    <rect x="660" y="60" width="120" height="80" rx="15" ry="15" fill="#FFB3D9" stroke="#FF99CC" stroke-width="2"/>
                    <text x="720" y="100" class="step-text">분석</text>
                    <text x="720" y="120" style="font-size: 12px; text-anchor: middle; fill: #666;">결과 평가</text>
                  </g>
                </svg>
            </div>

            <div class="steps-grid">
                <div class="step-card step-1">
                    <div class="step-num">Step 1</div>
                    <div class="step-name">기획</div>
                    <div class="step-desc">목표 설정 및 계획 수립</div>
                </div>
                <div class="step-card step-2">
                    <div class="step-num">Step 2</div>
                    <div class="step-name">제작</div>
                    <div class="step-desc">콘텐츠 개발 및 생산</div>
                </div>
                <div class="step-card step-3">
                    <div class="step-num">Step 3</div>
                    <div class="step-name">검토</div>
                    <div class="step-desc">품질 확인 및 수정</div>
                </div>
                <div class="step-card step-4">
                    <div class="step-num">Step 4</div>
                    <div class="step-name">배포</div>
                    <div class="step-desc">서비스 제공 및 공개</div>
                </div>
                <div class="step-card step-5">
                    <div class="step-num">Step 5</div>
                    <div class="step-name">분석</div>
                    <div class="step-desc">결과 평가 및 개선</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') document.body.classList.add('dark-mode');

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
        });
    </script>
</body>
</html>

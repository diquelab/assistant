<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매출 분석 차트 - 김비서</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f7fa 100%);
            color: #333;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            color: #e0e0e0;
        }

        header {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.dark-mode header {
            background: rgba(15, 15, 35, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            display: inline-block;
            color: #7bc43f;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #6ab030;
            transform: translateX(-5px);
        }

        .theme-toggle {
            width: 60px;
            height: 30px;
            background: rgba(123, 196, 63, 0.2);
            border: 1px solid rgba(123, 196, 63, 0.3);
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        body.dark-mode .theme-toggle {
            background: rgba(123, 196, 63, 0.15);
            border-color: rgba(123, 196, 63, 0.2);
        }

        .theme-toggle:hover {
            background: rgba(123, 196, 63, 0.3);
        }

        .toggle-circle {
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        body.dark-mode .toggle-circle {
            background: #1a1a3e;
            transform: translateX(30px);
            color: #ffd700;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        body.dark-mode .page-title h1 {
            color: #ffffff;
        }

        .page-title p {
            color: #999;
            font-size: 1.1em;
        }

        body.dark-mode .page-title p {
            color: #b0b0b0;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 1000px) {
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        body.dark-mode .chart-container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .chart-container:hover {
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
            background: rgba(255, 255, 255, 0.85);
        }

        body.dark-mode .chart-container:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 16px 48px rgba(123, 196, 63, 0.2);
        }

        .chart-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #7bc43f;
            padding-bottom: 10px;
        }

        body.dark-mode .chart-title {
            color: #ffffff;
            border-bottom-color: rgba(123, 196, 63, 0.6);
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        body.dark-mode .legend {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .stats-section {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        body.dark-mode .stats-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .stats-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #7bc43f;
            padding-bottom: 10px;
        }

        body.dark-mode .stats-title {
            color: #ffffff;
            border-bottom-color: rgba(123, 196, 63, 0.6);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: rgba(123, 196, 63, 0.08);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #7bc43f;
        }

        body.dark-mode .stat-card {
            background: rgba(123, 196, 63, 0.1);
            border-left-color: rgba(123, 196, 63, 0.6);
        }

        .stat-label {
            font-size: 0.9em;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        body.dark-mode .stat-label {
            color: #b0b0b0;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: 700;
            color: #7bc43f;
        }

        @media print {
            body {
                background: white;
            }

            header {
                display: none;
            }

            .chart-container, .stats-section {
                background: white;
                border: 1px solid #ddd;
                box-shadow: none;
                page-break-inside: avoid;
            }
        }

        /* 탭 네비게이션 */
        .tab-nav {
            border-top: 1px solid rgba(0, 0, 0, 0.06);
            margin-top: 10px;
            padding-top: 4px;
        }
        body.dark-mode .tab-nav {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tab-nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tab-nav-inner::-webkit-scrollbar { display: none; }
        .tab-btn {
            padding: 10px 18px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #777;
            font-weight: 600;
            font-size: 0.9em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            white-space: nowrap;
            border-radius: 8px 8px 0 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn:hover { color: #7bc43f; background: rgba(123, 196, 63, 0.07); }
        .tab-btn.active { color: #7bc43f; border-bottom-color: #7bc43f; background: rgba(123, 196, 63, 0.1); }
        body.dark-mode .tab-btn { color: #888; }
        body.dark-mode .tab-btn:hover { color: #9dda6f; background: rgba(123, 196, 63, 0.12); }
        body.dark-mode .tab-btn.active { color: #9dda6f; border-bottom-color: rgba(123, 196, 63, 0.7); background: rgba(123, 196, 63, 0.12); }
    </style>
</head>
<body>

    <div class="container">
        <div class="page-title">
            <h1>📊 매출 분석</h1>
            <p>2026년 1월 ~ 2월 매출 현황</p>

        <div class="chart-grid">
            <!-- 월별 매출 추이 -->
            <div class="chart-container">
                <h3 class="chart-title">📈 월별 매출 추이</h3>
                <canvas id="lineChart" width="500" height="300"></canvas>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: linear-gradient(135deg, #7bc43f 0%, #6ab030 100%);"></div>

                </div>

            <!-- 제품별 비교 -->
            <div class="chart-container">
                <h3 class="chart-title">📊 제품별 매출 비교</h3>
                <canvas id="barChart" width="500" height="300"></canvas>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #7bc43f;"></div>
                        <span>전자기기</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #555555;"></div>
                        <span>생활용품</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 통계 정보 -->
        <div class="stats-section">
            <h3 class="stats-title">📌 주요 통계</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">총 매출액</div>
                    <div class="stat-value" id="totalSales">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">평균 거래액</div>
                    <div class="stat-value" id="avgSales">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">최고 매출일</div>
                    <div class="stat-value" id="maxSalesDate">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">판매 지역</div>
                    <div class="stat-value" id="regionCount">3</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 데이터
        const salesData = [
            {date: "2026-01-05", product: "무선 이어폰", category: "전자기기", quantity: 45, price: 89000, sales: 4005000, region: "서울"},
            {date: "2026-01-05", product: "보조배터리", category: "전자기기", quantity: 32, price: 35000, sales: 1120000, region: "서울"},
            {date: "2026-01-05", product: "텀블러", category: "생활용품", quantity: 78, price: 25000, sales: 1950000, region: "부산"},
            {date: "2026-01-08", product: "무선 이어폰", category: "전자기기", quantity: 52, price: 89000, sales: 4628000, region: "서울"},
            {date: "2026-01-08", product: "블루투스 스피커", category: "전자기기", quantity: 18, price: 120000, sales: 2160000, region: "대구"},
            {date: "2026-01-08", product: "텀블러", category: "생활용품", quantity: 65, price: 25000, sales: 1625000, region: "서울"},
            {date: "2026-01-12", product: "보조배터리", category: "전자기기", quantity: 41, price: 35000, sales: 1435000, region: "부산"},
            {date: "2026-01-12", product: "무선 충전기", category: "전자기기", quantity: 29, price: 45000, sales: 1305000, region: "서울"},
            {date: "2026-01-12", product: "에코백", category: "생활용품", quantity: 93, price: 15000, sales: 1395000, region: "대구"},
            {date: "2026-01-15", product: "무선 이어폰", category: "전자기기", quantity: 38, price: 89000, sales: 3382000, region: "부산"},
            {date: "2026-01-15", product: "블루투스 스피커", category: "전자기기", quantity: 22, price: 120000, sales: 2640000, region: "서울"},
            {date: "2026-01-15", product: "텀블러", category: "생활용품", quantity: 84, price: 25000, sales: 2100000, region: "서울"},
            {date: "2026-01-19", product: "보조배터리", category: "전자기기", quantity: 55, price: 35000, sales: 1925000, region: "대구"},
            {date: "2026-01-19", product: "에코백", category: "생활용품", quantity: 110, price: 15000, sales: 1650000, region: "서울"},
            {date: "2026-01-19", product: "무선 충전기", category: "전자기기", quantity: 33, price: 45000, sales: 1485000, region: "부산"},
            {date: "2026-01-22", product: "무선 이어폰", category: "전자기기", quantity: 61, price: 89000, sales: 5429000, region: "서울"},
            {date: "2026-01-22", product: "텀블러", category: "생활용품", quantity: 72, price: 25000, sales: 1800000, region: "대구"},
            {date: "2026-01-22", product: "블루투스 스피커", category: "전자기기", quantity: 15, price: 120000, sales: 1800000, region: "부산"},
            {date: "2026-01-26", product: "보조배터리", category: "전자기기", quantity: 48, price: 35000, sales: 1680000, region: "서울"},
            {date: "2026-01-26", product: "에코백", category: "생활용품", quantity: 88, price: 15000, sales: 1320000, region: "서울"},
            {date: "2026-01-26", product: "무선 충전기", category: "전자기기", quantity: 37, price: 45000, sales: 1665000, region: "대구"},
            {date: "2026-02-01", product: "무선 이어폰", category: "전자기기", quantity: 70, price: 89000, sales: 6230000, region: "서울"},
            {date: "2026-02-01", product: "텀블러", category: "생활용품", quantity: 95, price: 25000, sales: 2375000, region: "부산"},
            {date: "2026-02-01", product: "보조배터리", category: "전자기기", quantity: 43, price: 35000, sales: 1505000, region: "서울"},
            {date: "2026-02-05", product: "블루투스 스피커", category: "전자기기", quantity: 25, price: 120000, sales: 3000000, region: "서울"},
            {date: "2026-02-05", product: "에코백", category: "생활용품", quantity: 120, price: 15000, sales: 1800000, region: "대구"},
            {date: "2026-02-05", product: "무선 충전기", category: "전자기기", quantity: 31, price: 45000, sales: 1395000, region: "부산"},
            {date: "2026-02-10", product: "무선 이어폰", category: "전자기기", quantity: 58, price: 89000, sales: 5162000, region: "대구"},
            {date: "2026-02-10", product: "텀블러", category: "생활용품", quantity: 67, price: 25000, sales: 1675000, region: "서울"},
            {date: "2026-02-10", product: "보조배터리", category: "전자기기", quantity: 39, price: 35000, sales: 1365000, region: "서울"},
        ];

        // 숫자 포맷 함수
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // 월별 매출 계산
        function getMonthlyData() {
            const monthlyMap = {};
            salesData.forEach(item => {
                const month = item.date.substring(0, 7); // YYYY-MM
                monthlyMap[month] = (monthlyMap[month] || 0) + item.sales;
            });
            return Object.entries(monthlyMap).sort();
        }

        // 제품별 매출 계산
        function getProductData() {
            const productMap = {};
            salesData.forEach(item => {
                if (!productMap[item.product]) {
                    productMap[item.product] = { sales: 0, category: item.category };
                }
                productMap[item.product].sales += item.sales;
            });
            return Object.entries(productMap)
                .map(([name, data]) => ({ name, ...data }))
                .sort((a, b) => b.sales - a.sales);
        }

        // 선 그래프 그리기
        function drawLineChart() {
            const canvas = document.getElementById('lineChart');
            const ctx = canvas.getContext('2d');
            const monthlyData = getMonthlyData();

            // Canvas 크기 설정
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);

            const padding = 50;
            const width = rect.width - padding * 2;
            const height = rect.height - padding * 2;

            // 배경 및 그리드
            const isDarkMode = document.body.classList.contains('dark-mode');
            ctx.fillStyle = isDarkMode ? 'transparent' : 'transparent';
            ctx.fillRect(0, 0, rect.width, rect.height);

            // Y축 범위 계산
            const maxSales = Math.max(...monthlyData.map(d => d[1]));
            const yScale = height / maxSales;

            // 그리드 라인
            ctx.strokeStyle = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(padding + width, y);
                ctx.stroke();
            }

            // Y축 레이블
            ctx.fillStyle = isDarkMode ? '#b0b0b0' : '#999';
            ctx.textAlign = 'right';
            ctx.font = '12px Segoe UI';
            for (let i = 0; i <= 5; i++) {
                const value = (maxSales / 5) * (5 - i);
                const y = padding + (height / 5) * i;
                ctx.fillText(formatNumber(Math.round(value / 10000000)) + '억', padding - 10, y + 4);
            }

            // X축 레이블
            ctx.textAlign = 'center';
            monthlyData.forEach((item, i) => {
                const x = padding + (width / (monthlyData.length - 1)) * i;
                const month = item[0].substring(5); // MM 부분만
                ctx.fillText(month, x, rect.height - 20);
            });

            // 선 그래프 그리기
            ctx.strokeStyle = '#7bc43f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            monthlyData.forEach((item, i) => {
                const x = padding + (width / (monthlyData.length - 1)) * i;
                const y = padding + height - item[1] * yScale;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();

            // 포인트 그리기
            ctx.fillStyle = '#7bc43f';
            monthlyData.forEach((item, i) => {
                const x = padding + (width / (monthlyData.length - 1)) * i;
                const y = padding + height - item[1] * yScale;
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fill();

                // 값 표시
                ctx.fillStyle = isDarkMode ? '#ffffff' : '#2c3e50';
                ctx.textAlign = 'center';
                ctx.font = 'bold 12px Segoe UI';
                ctx.fillText(formatNumber(Math.round(item[1] / 10000000)) + '억', x, y - 15);
            });
        }

        // 막대 그래프 그리기
        function drawBarChart() {
            const canvas = document.getElementById('barChart');
            const ctx = canvas.getContext('2d');
            const productData = getProductData();

            // Canvas 크기 설정
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);

            const padding = 50;
            const width = rect.width - padding * 2;
            const height = rect.height - padding * 2;

            // 배경
            const isDarkMode = document.body.classList.contains('dark-mode');
            ctx.fillStyle = isDarkMode ? 'transparent' : 'transparent';
            ctx.fillRect(0, 0, rect.width, rect.height);

            // Y축 범위 계산
            const maxSales = Math.max(...productData.map(p => p.sales));
            const yScale = height / maxSales;

            // 그리드 라인
            ctx.strokeStyle = isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding + (height / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(padding + width, y);
                ctx.stroke();
            }

            // Y축 레이블
            ctx.fillStyle = isDarkMode ? '#b0b0b0' : '#999';
            ctx.textAlign = 'right';
            ctx.font = '12px Segoe UI';
            for (let i = 0; i <= 5; i++) {
                const value = (maxSales / 5) * (5 - i);
                const y = padding + (height / 5) * i;
                ctx.fillText(formatNumber(Math.round(value / 1000000)) + '백만', padding - 10, y + 4);
            }

            // 막대 그리기
            const barWidth = width / (productData.length * 1.5);
            productData.forEach((item, i) => {
                const x = padding + (width / productData.length) * i + (width / productData.length - barWidth) / 2;
                const barHeight = item.sales * yScale;
                const y = padding + height - barHeight;

                // 색상 (카테고리별)
                const color = item.category === '전자기기' ? '#7bc43f' : '#555555';
                ctx.fillStyle = color;
                ctx.fillRect(x, y, barWidth, barHeight);

                // X축 레이블
                ctx.fillStyle = isDarkMode ? '#b0b0b0' : '#999';
                ctx.textAlign = 'center';
                ctx.font = '11px Segoe UI';
                const lines = item.name.split('');
                ctx.save();
                ctx.translate(x + barWidth / 2, rect.height - 25);
                ctx.fillText(item.name, 0, 0);
                ctx.restore();

                // 값 표시
                ctx.fillStyle = isDarkMode ? '#ffffff' : '#2c3e50';
                ctx.textAlign = 'center';
                ctx.font = 'bold 11px Segoe UI';
                const displayValue = formatNumber(Math.round(item.sales / 1000000)) + '백만';
                ctx.fillText(displayValue, x + barWidth / 2, y - 5);
            });
        }

        // 통계 업데이트
        function updateStats() {
            const totalSales = salesData.reduce((sum, item) => sum + item.sales, 0);
            const avgSales = Math.round(totalSales / salesData.length);

            let maxSalesDay = { date: '', sales: 0 };
            const dailyMap = {};
            salesData.forEach(item => {
                dailyMap[item.date] = (dailyMap[item.date] || 0) + item.sales;
            });
            Object.entries(dailyMap).forEach(([date, sales]) => {
                if (sales > maxSalesDay.sales) {
                    maxSalesDay = { date, sales };
                }
            });

            document.getElementById('totalSales').textContent = formatNumber(Math.round(totalSales / 100000000)) + '억';
            document.getElementById('avgSales').textContent = formatNumber(Math.round(avgSales / 10000)) + '만';
            document.getElementById('maxSalesDate').textContent = maxSalesDay.date;
            document.getElementById('regionCount').textContent = '3개';
        }

        // 테마 토글
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
            localStorage.setItem('theme', currentTheme);
            drawLineChart();
            drawBarChart();
        });

        // 초기화
        updateStats();
        drawLineChart();
        drawBarChart();

        // 윈도우 리사이즈 시 다시 그리기
        window.addEventListener('resize', () => {
            drawLineChart();
            drawBarChart();
        });
    </script>
</body>
</html>
